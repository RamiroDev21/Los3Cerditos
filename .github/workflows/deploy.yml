name: Publicar en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major as local development, so npm validates package-lock.json the same way.
          node-version: 24
          cache: npm

      # npm install instead of npm ci: a lockfile written on Windows omits a few optional
      # WebAssembly packages (@emnapi/*) that npm ci on Linux then refuses. Versions still come from the lock.
      - run: npm install --no-audit --no-fund

      - name: Compilar sitio estático
        run: npm run build
        env:
          # El sitio se sirve en https://ramirodev21.github.io/Los3Cerditos/
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
